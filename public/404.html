<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>DX Security - Surveillance & Smart Security Systems</title>
    <script>
      // GitHub Pages SPA redirect
      var path = window.location.pathname;
      var repo = path.split('/')[1] || '';
      var search = window.location.search;
      var hash = window.location.hash;
      // Redirect back to root of the repo
      window.location.replace('/' + repo + '/' + (search || '') + (hash || ''));
    </script>
  </head>
  <body style="background:#020617;color:#94a3b8;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <p>Redirecting to DX Security...</p>
  </body>
</html>
